name: Check a new version
run-name: Check a new version
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/4 * * *"
jobs:
  get_projects_config:
    name: Get projects config
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.convert-json.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert JSON to String
        id: convert-json
        run: |
          echo "result=$(jq -c '.' ./projects.json)" >> "$GITHUB_OUTPUT"
  check_new_version:
    name: Check a new version for ${{ matrix.project_name }}
    needs: get_projects_config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get_projects_config.outputs.config) }}
    steps:
      - name: 📝 Get last version from the DockerHub registry
        id: get_last_version_from_dockerhub
        run: |
          set -euo pipefail
          dockerhub_response=$(curl -sS "https://registry.hub.docker.com/v2/repositories/svetekllc/${{ matrix.project_name }}/tags/")
          last_version_info=$(printf '%s' "$dockerhub_response" | jq -r -c '([.results[]?] | max_by(.tag_last_pushed) | {name, tag_last_pushed}) // ""')
          version=$(printf '%s' "$last_version_info" | jq -r '.name // ""')
          version_date=$(printf '%s' "$last_version_info" | jq -r '.tag_last_pushed // ""')
          echo "Last version is ${version:-none}"
          echo "d_last_version=$version" >> "$GITHUB_OUTPUT"
          echo "Last version date is ${version_date:-none}"
          echo "d_last_version_date=$version_date" >> "$GITHUB_OUTPUT"

      - name: 📝 Get last version from the GitHub repository
        id: get_last_version_from_github
        run: |
          set -euo pipefail
          github_releases_response=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ matrix.git_api_url}}/${{ matrix.git_repository}}/releases")

          last_version_info=$(printf '%s' "$github_releases_response" | jq -e -r -c '
            if type == "array" then
              first(.[] | select(.draft == false and ((.prerelease == false) or ($include_prerelease and .prerelease == true))) | {tag_name, published_at})
            elif type == "object" and .message? then
              .message | halt_error(1)
            else
              "Unexpected GitHub API response type: \(type)" | halt_error(1)
            end
          ' --argjson include_prerelease '${{ matrix.include_prerelease || false }}')
          version=$(printf '%s' "$last_version_info" | jq -r .tag_name)
          version_date=$(printf '%s' "$last_version_info" | jq -r .published_at)
          echo "Last version is $version"
          echo "g_last_version=$version" >> "$GITHUB_OUTPUT"
          echo "Last version date is $version_date"
          echo "g_last_version_date=$version_date" >> "$GITHUB_OUTPUT"

      - name: 🆚 Compare versions
        id: compare_versions
        env:
          bin: ${{ matrix.binary }}
          git_repository: ${{ matrix.git_url }}/${{ matrix.git_repository }}
          project_name: ${{ matrix.project_name }}
          tag: ${{ steps.get_last_version_from_github.outputs.g_last_version }}
          version_from_docker: ${{ steps.get_last_version_from_dockerhub.outputs.d_last_version }}
          version_date_from_docker: ${{ steps.get_last_version_from_dockerhub.outputs.d_last_version_date }}
          version_from_git: ${{ steps.get_last_version_from_github.outputs.g_last_version }}
          version_date_from_git: ${{ steps.get_last_version_from_github.outputs.g_last_version_date }}
        run: |
          set -euo pipefail
          if [[ "${version_from_docker}" != "$version_from_git" ]] || [[ "${version_date_from_docker}" < "${version_date_from_git}" ]]
          then
            echo "Versions are different. Running build."
            curl -fsS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/svetek/node-tools/actions/workflows/build_image.yaml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"project_name\": \"$project_name\",\"tag\": \"$tag\", \"git_repository\": \"$git_repository\", \"bin\": \"$bin\"}}"
          else
            echo "Versions are the same. Skipping build."
          fi
