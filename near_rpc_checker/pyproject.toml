[project]
name = "near-rpc-checker"
version = "0.1.0"
description = "NEAR mainnet/testnet height and Lava specification readiness checks"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
near_rpc_checker = ["near.json"]
