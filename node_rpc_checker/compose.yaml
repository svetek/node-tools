services:
  node-rpc-checker:
    image: svetekllc/node-rpc-checker:${CHECKER_VERSION:?Run python3 tools/release.py compose ...}
    build:
      context: .
      args:
        VERSION: ${CHECKER_VERSION:?Run python3 tools/release.py compose ...}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
