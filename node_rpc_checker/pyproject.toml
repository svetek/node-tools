[project]
name = "node-rpc-checker"
dynamic = ["version"]
description = "Lava-spec-driven NEAR and EVM RPC readiness checks"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["node_rpc_checker*"]
exclude = ["legacy*", "tests*"]

[tool.setuptools.package-data]
node_rpc_checker = ["specs/*.json"]

[tool.setuptools.dynamic]
version = {attr = "node_rpc_checker.__version__"}
